<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Editor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #e0e0e0; min-height: 100vh; padding: 2rem; }
    .wrap { max-width: 860px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; color: #fff; }
    .card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 1.5rem; margin-bottom: 1.5rem; }
    h2 { font-size: .85rem; color: #888; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: .06em; }

    /* Drop zone */
    #drop-zone { border: 2px dashed #333; border-radius: 8px; padding: 2rem; text-align: center; cursor: pointer; transition: .2s; }
    #drop-zone.over { border-color: #4f8ef7; background: #1c2a3a; }
    #drop-zone p { color: #555; }
    #drop-zone span { color: #4f8ef7; font-weight: 600; }

    /* Upload list */
    #upload-list { display: flex; flex-direction: column; gap: .4rem; margin-top: .75rem; }
    .up-item { background: #222; border-radius: 6px; padding: .5rem .75rem; }
    .up-row { display: flex; justify-content: space-between; font-size: .82rem; margin-bottom: .3rem; }
    .up-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 75%; }
    .up-pct { color: #888; white-space: nowrap; }
    .pbar-wrap { background: #333; border-radius: 3px; height: 3px; }
    .pbar { height: 100%; background: #4f8ef7; border-radius: 3px; transition: width .15s; }

    /* Clip cards */
    .clip-card { background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 8px; overflow: hidden; }
    .clip-head {
      display: flex; align-items: center; gap: .5rem;
      padding: .6rem 1rem; background: #161616; border-bottom: 1px solid #2a2a2a;
    }
    .clip-head .name { flex: 1; font-size: .88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .clip-head .dur { font-size: .78rem; color: #555; margin-right: .25rem; white-space: nowrap; }
    .icon-btn {
      background: none; border: 1px solid #2a2a2a; border-radius: 4px;
      color: #666; padding: .2rem .4rem; cursor: pointer; font-size: .8rem; line-height: 1;
      transition: .15s;
    }
    .icon-btn:hover { color: #ccc; border-color: #555; }
    .icon-btn:disabled { opacity: .3; cursor: default; }
    .icon-btn.red:hover { color: #f55; border-color: #f55; }

    .clip-body { padding: 1rem; display: flex; flex-direction: column; gap: .75rem; }
    video { width: 100%; max-height: 280px; border-radius: 6px; background: #000; object-fit: contain; display: block; }

    .trim-group { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
    .trim-btn {
      background: #252525; border: 1px solid #333; border-radius: 6px;
      color: #ccc; padding: .38rem .75rem; cursor: pointer; font-size: .82rem;
      transition: .15s; white-space: nowrap;
    }
    .trim-btn:hover { background: #2e2e2e; border-color: #444; }
    .trim-btn.set { background: #1a3020; border-color: #2d5a3a; color: #5ecf8a; }
    .timecode {
      font-family: monospace; font-size: .82rem; color: #4f8ef7;
      background: #0f0f0f; border: 1px solid #222; padding: .3rem .55rem;
      border-radius: 4px; min-width: 64px; text-align: center;
    }
    .reset-btn {
      background: none; border: none; color: #444; cursor: pointer; font-size: .9rem; padding: 0 .2rem;
      transition: color .15s;
    }
    .reset-btn:hover { color: #888; }

    .settings-row { display: flex; gap: 1.25rem; align-items: center; flex-wrap: wrap; }
    .settings-row label { font-size: .78rem; color: #666; }
    select {
      background: #111; border: 1px solid #2a2a2a; color: #e0e0e0;
      border-radius: 5px; padding: .35rem .55rem; font-size: .82rem; cursor: pointer;
    }
    select:focus { outline: none; border-color: #4f8ef7; }

    /* Transition connector */
    .t-connector { display: flex; align-items: center; gap: .75rem; padding: .35rem 0; }
    .t-line { flex: 1; height: 1px; background: #222; }
    .t-connector select { font-size: .78rem; }

    /* Buttons */
    .btn {
      background: #4f8ef7; color: #fff; border: none; border-radius: 6px;
      padding: .65rem 1.6rem; font-size: .95rem; cursor: pointer; font-weight: 600;
      transition: background .2s;
    }
    .btn:hover { background: #3a7ae0; }
    .btn:disabled { background: #252525; color: #444; cursor: not-allowed; }

    /* Status */
    #status-box { display: none; }
    .badge { display: inline-block; padding: .28rem .75rem; border-radius: 20px; font-size: .82rem; font-weight: 600; margin-bottom: .75rem; }
    .badge.processing { background: #1e2e10; color: #8bc34a; }
    .badge.done { background: #102010; color: #4caf82; }
    .badge.error { background: #2e1010; color: #f55; }
    #download-link {
      display: none; background: #102010; color: #4caf82; border: 1px solid #1e4a2e;
      border-radius: 6px; padding: .6rem 1.4rem; font-weight: 600; text-decoration: none; font-size: .9rem;
    }
    #download-link:hover { background: #152515; }

    pre { background: #0f0f0f; border: 1px solid #222; border-radius: 6px; padding: .75rem; font-size: .75rem; overflow-x: auto; color: #7ec8a0; white-space: pre-wrap; margin-top: .5rem; }
    .err { color: #f66; font-size: .82rem; margin-top: .5rem; }
    .text-btn { background: none; border: none; color: #555; cursor: pointer; font-size: .78rem; text-decoration: underline; padding: 0; }
    .text-btn:hover { color: #888; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Video Editor</h1>

  <!-- Upload -->
  <div class="card">
    <h2>1. Clips hochladen</h2>
    <div id="drop-zone">
      <p>Dateien hier ablegen oder <span>klicken</span></p>
      <input type="file" id="file-input" multiple accept="video/*" style="display:none">
    </div>
    <div id="upload-list"></div>
    <div id="upload-err" class="err"></div>
  </div>

  <!-- Timeline -->
  <div class="card" id="timeline-card" style="display:none">
    <h2>2. Schnitt & Reihenfolge</h2>
    <p style="font-size:.82rem;color:#555;margin-bottom:1rem">
      Video abspielen → gewünschte Stelle anhalten → <strong style="color:#888">Hier starten</strong> oder <strong style="color:#888">Hier enden</strong> klicken.
    </p>
    <div id="timeline-list"></div>
    <div style="margin-top:1.25rem;display:flex;gap:.75rem;align-items:center;flex-wrap:wrap">
      <button class="btn" id="create-btn" disabled>Video zusammensetzen</button>
      <div id="create-err" class="err" style="margin:0"></div>
    </div>
  </div>

  <!-- Status -->
  <div class="card" id="status-box">
    <h2>Status</h2>
    <div id="status-badge" class="badge processing">Verarbeitung...</div>
    <div id="status-msg" style="font-size:.85rem;margin-bottom:.5rem"></div>
    <a id="download-link" href="#">Fertiges Video herunterladen</a>
    <div style="margin-top:.75rem">
      <button class="text-btn" onclick="togglePlan()">Schnittplan anzeigen/verstecken</button>
      <pre id="plan-pre" style="display:none"></pre>
    </div>
  </div>
</div>

<script>
  const CHUNK = 10 * 1024 * 1024;
  let clips = []; // {clip_id,name,duration,start,end,rotate,transition_in,transition_duration}
  let uploading = 0;

  // --- Upload ---
  const dz = document.getElementById('drop-zone');
  const fi = document.getElementById('file-input');
  dz.addEventListener('click', () => fi.click());
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('over'));
  dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('over'); [...e.dataTransfer.files].forEach(uploadFile); });
  fi.addEventListener('change', () => [...fi.files].forEach(uploadFile));

  function uploadFile(file) {
    const uid = crypto.randomUUID();
    const total = Math.max(1, Math.ceil(file.size / CHUNK));
    const list = document.getElementById('upload-list');
    const row = document.createElement('div');
    row.className = 'up-item'; row.id = `up-${uid}`;
    row.innerHTML = `<div class="up-row"><span class="up-name">${file.name}</span><span class="up-pct" id="pct-${uid}">0%</span></div><div class="pbar-wrap"><div class="pbar" id="pb-${uid}" style="width:0"></div></div>`;
    list.appendChild(row);
    uploading++; updateBtn();

    (async () => {
      for (let i = 0; i < total; i++) {
        const blob = file.slice(i * CHUNK, (i + 1) * CHUNK);
        const fd = new FormData();
        fd.append('file', blob, file.name);
        fd.append('upload_id', uid);
        fd.append('chunk_index', i);
        fd.append('total_chunks', total);
        fd.append('filename', file.name);
        let res, data;
        for (let t = 0; t < 3; t++) {
          try { res = await fetch('/upload/chunk', {method:'POST',body:fd}); data = await res.json(); if (res.ok) break; }
          catch(e) { if (t===2) throw e; await sleep(1000*(t+1)); }
        }
        if (!res.ok) throw new Error(data?.detail || 'Upload fehlgeschlagen');
        const pct = Math.round((i+1)/total*100);
        document.getElementById(`pb-${uid}`).style.width = pct+'%';
        document.getElementById(`pct-${uid}`).textContent = pct+'%';
        if (data.status === 'complete') {
          document.getElementById(`pct-${uid}`).textContent = '✓ '+fmt(data.duration);
          document.getElementById(`pb-${uid}`).style.background = '#4caf82';
          clips.push({clip_id:data.clip_id, name:data.name, duration:data.duration, start:null, end:null, rotate:0, transition_in:null, transition_duration:null});
          render();
        }
      }
    })().catch(e => {
      document.getElementById('upload-err').textContent = file.name+': '+e.message;
      document.getElementById(`pb-${uid}`).style.background = '#f55';
    }).finally(() => { uploading--; updateBtn(); });
  }

  // --- Render timeline ---
  function render() {
    const list = document.getElementById('timeline-list');
    list.innerHTML = '';
    document.getElementById('timeline-card').style.display = clips.length ? 'block' : 'none';

    clips.forEach((c, idx) => {
      // Transition connector (before every clip except first)
      if (idx > 0) {
        const conn = document.createElement('div');
        conn.className = 't-connector';
        const curVal = c.transition_in ? `${c.transition_in}:${c.transition_duration}` : '';
        conn.innerHTML = `
          <div class="t-line"></div>
          <select onchange="setTransition(${idx},this.value)">
            <option value="">— Harter Schnitt —</option>
            <option value="crossfade:0.5">Crossfade 0.5s</option>
            <option value="crossfade:1">Crossfade 1s</option>
            <option value="crossfade:2">Crossfade 2s</option>
            <option value="fadeblack:0.5">Fade to Black 0.5s</option>
            <option value="fadeblack:1">Fade to Black 1s</option>
          </select>
          <div class="t-line"></div>`;
        conn.querySelector('select').value = curVal;
        list.appendChild(conn);
      }

      const card = document.createElement('div');
      card.className = 'clip-card';
      card.innerHTML = `
        <div class="clip-head">
          <span class="name" title="${c.name}">${c.name}</span>
          <span class="dur">${fmt(c.duration)}</span>
          <button class="icon-btn" onclick="move(${idx},-1)" ${idx===0?'disabled':''} title="Nach oben">↑</button>
          <button class="icon-btn" onclick="move(${idx},1)" ${idx===clips.length-1?'disabled':''} title="Nach unten">↓</button>
          <button class="icon-btn red" onclick="remove(${idx})" title="Entfernen">✕</button>
        </div>
        <div class="clip-body">
          <video id="vid-${c.clip_id}" preload="metadata" controls>
            <source src="/preview/${c.clip_id}" type="video/mp4">
          </video>

          <div class="trim-group">
            <button class="trim-btn ${c.start!==null?'set':''}" onclick="setStart(${idx})">▶ Hier starten</button>
            <span class="timecode" id="ts-${c.clip_id}">${c.start!==null?tc(c.start):'Anfang'}</span>
            <button class="reset-btn" id="rs-${c.clip_id}" style="${c.start!==null?'':'visibility:hidden'}" onclick="resetStart(${idx})">✕</button>
          </div>

          <div class="trim-group">
            <button class="trim-btn ${c.end!==null?'set':''}" onclick="setEnd(${idx})">⏹ Hier enden</button>
            <span class="timecode" id="te-${c.clip_id}">${c.end!==null?tc(c.end):'Ende'}</span>
            <button class="reset-btn" id="re-${c.clip_id}" style="${c.end!==null?'':'visibility:hidden'}" onclick="resetEnd(${idx})">✕</button>
          </div>

          <div class="settings-row">
            <label>Rotation</label>
            <select onchange="setRotate(${idx},+this.value)">
              <option value="0" ${c.rotate===0?'selected':''}>Keine</option>
              <option value="-90" ${c.rotate===-90?'selected':''}>90° links</option>
              <option value="90" ${c.rotate===90?'selected':''}>90° rechts</option>
              <option value="180" ${c.rotate===180?'selected':''}>180°</option>
            </select>
          </div>
        </div>`;
      list.appendChild(card);
    });

    updateBtn();
  }

  function setStart(idx) {
    const c = clips[idx];
    const v = document.getElementById(`vid-${c.clip_id}`);
    c.start = v.currentTime;
    document.getElementById(`ts-${c.clip_id}`).textContent = tc(c.start);
    document.getElementById(`rs-${c.clip_id}`).style.visibility = '';
    // Mark button active without full re-render
    const btns = document.querySelectorAll(`#card-trimbtns-${c.clip_id} .trim-btn`);
  }
  function resetStart(idx) {
    const c = clips[idx];
    c.start = null;
    document.getElementById(`ts-${c.clip_id}`).textContent = 'Anfang';
    document.getElementById(`rs-${c.clip_id}`).style.visibility = 'hidden';
  }
  function setEnd(idx) {
    const c = clips[idx];
    const v = document.getElementById(`vid-${c.clip_id}`);
    c.end = v.currentTime;
    document.getElementById(`te-${c.clip_id}`).textContent = tc(c.end);
    document.getElementById(`re-${c.clip_id}`).style.visibility = '';
  }
  function resetEnd(idx) {
    const c = clips[idx];
    c.end = null;
    document.getElementById(`te-${c.clip_id}`).textContent = 'Ende';
    document.getElementById(`re-${c.clip_id}`).style.visibility = 'hidden';
  }
  function setRotate(idx, val) { clips[idx].rotate = val; }
  function setTransition(idx, val) {
    if (!val) { clips[idx].transition_in = null; clips[idx].transition_duration = null; }
    else { const [t,d] = val.split(':'); clips[idx].transition_in = t; clips[idx].transition_duration = +d; }
  }
  function move(idx, dir) {
    const o = idx+dir;
    if (o<0||o>=clips.length) return;
    [clips[idx],clips[o]] = [clips[o],clips[idx]];
    render();
  }
  function remove(idx) { clips.splice(idx,1); render(); }
  function updateBtn() {
    const btn = document.getElementById('create-btn');
    if (btn) btn.disabled = uploading>0 || clips.length===0;
  }

  // --- Create ---
  document.getElementById('create-btn').addEventListener('click', async () => {
    const err = document.getElementById('create-err');
    err.textContent = '';
    document.getElementById('create-btn').disabled = true;

    const plan = {
      steps: clips.map(c => ({
        clip: c.name, clip_id: c.clip_id,
        start: c.start, end: c.end,
        rotate: c.rotate !== 0 ? c.rotate : null,
        transition_in: c.transition_in,
        transition_duration: c.transition_duration,
      })),
      output_format: 'mp4'
    };

    try {
      const res = await fetch('/edit', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({clip_ids: clips.map(c=>c.clip_id), plan})
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail||'Fehler');

      const sb = document.getElementById('status-box');
      sb.style.display = 'block';
      sb.scrollIntoView({behavior:'smooth',block:'start'});
      document.getElementById('plan-pre').textContent = JSON.stringify(data.plan,null,2);
      document.getElementById('download-link').style.display = 'none';
      document.getElementById('status-badge').className = 'badge processing';
      document.getElementById('status-badge').textContent = 'Verarbeitung...';
      document.getElementById('status-msg').textContent = '';
      pollStatus(data.job_id);
    } catch(e) {
      err.textContent = e.message;
      document.getElementById('create-btn').disabled = false;
    }
  });

  async function pollStatus(jobId) {
    while (true) {
      await sleep(1500);
      try {
        const d = await fetch(`/status/${jobId}`).then(r=>r.json());
        if (d.status==='done') {
          document.getElementById('status-badge').className='badge done';
          document.getElementById('status-badge').textContent='Fertig ✓';
          const dl = document.getElementById('download-link');
          dl.href=`/download/${jobId}`; dl.style.display='inline-block';
          document.getElementById('create-btn').disabled = false;
          break;
        } else if (d.status==='error') {
          document.getElementById('status-badge').className='badge error';
          document.getElementById('status-badge').textContent='Fehler';
          document.getElementById('status-msg').textContent=d.error||'Unbekannter Fehler';
          document.getElementById('create-btn').disabled = false;
          break;
        }
      } catch(_) {}
    }
  }

  function togglePlan() {
    const p = document.getElementById('plan-pre');
    p.style.display = p.style.display==='none' ? 'block' : 'none';
  }

  // Utils
  function fmt(s) { const m=Math.floor(s/60); return `${m}:${(s%60).toFixed(1).padStart(4,'0')}`; }
  function tc(s) { const m=Math.floor(s/60); const sec=(s%60).toFixed(2); return `${m}:${sec.padStart(5,'0')}`; }
  function sleep(ms) { return new Promise(r=>setTimeout(r,ms)); }
</script>
</body>
</html>
